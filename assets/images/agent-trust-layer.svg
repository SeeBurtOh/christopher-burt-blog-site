<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent trust layer architecture</title>
  <desc id="desc">A layered diagram showing users, agents, tools, data, and the trust layer controls between them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a13"/>
      <stop offset="100%" stop-color="#17122a"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;fill:#f5f7fb;font-size:28px;font-weight:700}
      .small{font-family:Inter,Arial,sans-serif;fill:#b8c0d9;font-size:18px}
      .tiny{font-family:Inter,Arial,sans-serif;fill:#dbe4ff;font-size:16px;font-weight:600}
      .box{fill:rgba(255,255,255,.055);stroke:rgba(255,255,255,.22);stroke-width:2;rx:22}
      .trust{fill:rgba(0,229,255,.08);stroke:url(#cyanPurple);stroke-width:3;rx:26}
      .line{stroke:#6f7aa8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6f7aa8"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1060" cy="95" r="180" fill="#7c4dff" opacity=".12"/>
  <circle cx="135" cy="615" r="230" fill="#00e5ff" opacity=".09"/>

  <text x="70" y="78" class="label">The missing layer in agent architecture</text>
  <text x="70" y="112" class="small">Capability is the fun part. Trust is the part that keeps Legal from developing a twitch.</text>

  <rect x="70" y="170" width="220" height="120" class="box"/>
  <text x="105" y="220" class="label" font-size="24">Humans</text>
  <text x="105" y="252" class="small">intent · approval</text>

  <rect x="70" y="430" width="220" height="120" class="box"/>
  <text x="105" y="480" class="label" font-size="24">Policies</text>
  <text x="105" y="512" class="small">risk · scope · limits</text>

  <rect x="455" y="185" width="290" height="350" class="trust" filter="url(#glow)"/>
  <text x="505" y="235" class="label" font-size="26">Trust layer</text>
  <text x="505" y="285" class="tiny">Identity</text>
  <text x="505" y="325" class="tiny">Permissions</text>
  <text x="505" y="365" class="tiny">Tool boundaries</text>
  <text x="505" y="405" class="tiny">Audit trail</text>
  <text x="505" y="445" class="tiny">Human checkpoints</text>
  <text x="505" y="485" class="tiny">Revocation</text>

  <rect x="910" y="150" width="220" height="100" class="box"/>
  <text x="960" y="195" class="label" font-size="24">Agents</text>
  <text x="945" y="225" class="small">plan · act · adapt</text>

  <rect x="910" y="310" width="220" height="100" class="box"/>
  <text x="970" y="355" class="label" font-size="24">Tools</text>
  <text x="945" y="385" class="small">APIs · code · workflows</text>

  <rect x="910" y="470" width="220" height="100" class="box"/>
  <text x="975" y="515" class="label" font-size="24">Data</text>
  <text x="948" y="545" class="small">private · regulated · messy</text>

  <path d="M290 230 C350 230 390 260 455 300" class="line"/>
  <path d="M290 490 C360 490 395 460 455 430" class="line"/>
  <path d="M745 280 C810 240 845 205 910 200" class="line"/>
  <path d="M745 360 C820 360 850 360 910 360" class="line"/>
  <path d="M745 445 C810 490 850 515 910 520" class="line"/>

  <text x="410" y="640" class="small">Question for every agent: Who are you, what may you do, and how do we prove it afterward?</text>
</svg>
